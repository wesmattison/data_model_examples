table:
  name: catalog.schema.marketproduct  # TODO: Update with actual catalog.schema
  type: dimension
  description: "Insurance product dimension containing state (market), insurance program type, and product brand information. This table became a catch-all for various hierarchies over time, but end users primarily work with: state, program (Medicaid/Medicare/Marketplace), and product brand name."
  grain: "One row per unique combination of market, program, and product"
  source_system: "TODO: Identify source system"
  refresh_frequency: "TODO: Specify refresh frequency"
  
  primary_key: [MarketProduct_SK]
  
  # Natural key is the combination of state + program + product
  natural_key: [MarketCode, ProgramCode, ProductCode]
  
  data_quality_notes:
    - "Table contains many legacy/unused fields from various hierarchies"
    - "ProgramDesc has some known drift (~10 program types with variations)"
    - "Only 4 fields actively used by end users: MarketDesc, MarketCode, ProgramDesc, ProductDesc"
    - "Recommendation: Create simplified metric view exposing only the actively used fields"

columns:
  # Surrogate Key
  - name: MarketProduct_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "System-generated surrogate key - use for joins only"
    
    genie:
      description: "Unique system-generated identifier for each market-product combination"
      synonyms: ["market product key", "market product ID"]
      confidence_score: 0.95
      needs_review: false
    
    constraints:
      nullable: false
      unique: true
      primary_key: true

  # Natural Keys / Business Identifiers
  - name: ClientID
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: natural_key
      reason: "Business identifier for client - useful for filtering and analysis"
    
    genie:
      description: "NEEDS REVIEW: Client identifier - unclear if this refers to customer, account, or organizational unit"
      synonyms: ["client", "client number", "account"]
      confidence_score: 0.50
      needs_review: true
      review_notes: "Ambiguous - need to clarify what 'Client' means in business context"
    
    constraints:
      nullable: true
    
    sample_values: []

  - name: MarketCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "PRIMARY FIELD: State code (e.g., 'CA', 'TX', 'FL') - essential for geographic analysis"
    
    genie:
      description: "Two-letter US state code representing the geographic market"
      synonyms: ["state code", "state", "market", "state abbreviation"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: false
    
    sample_values: ["CA", "TX", "FL", "NY", "IL"]

  - name: MarketDesc
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "PRIMARY FIELD: State name (e.g., 'California', 'Texas') - primary display field for geographic analysis"
    
    genie:
      description: "Full US state name for the market"
      synonyms: ["state name", "state", "market name"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: false
    
    sample_values: ["California", "Texas", "Florida", "New York", "Illinois"]

  - name: ProductCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Product code corresponding to ProductDesc - useful for filtering and joins"
    
