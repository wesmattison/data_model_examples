# Metric View Recommendations
metric_view_suggestions:
  
  confidence_threshold: 0.70
  
  status: "READY - Primary fields identified and documented"
  
  # Only expose the 4 fields actually used by end users
  recommended_dimensions:
    - MarketCode          # State code (CA, TX, etc.)
    - MarketDesc          # State name (California, Texas, etc.)
    - ProgramDesc         # Insurance program (Medicaid, Medicare, Marketplace, etc.)
    - ProductDesc         # Product brand name
  
  # Optional supporting fields
  optional_dimensions:
    - ProductCode         # If code-based filtering is needed
    - MarketProduct_SK    # Only for joins to fact tables
  
  recommended_measures: []  # This is a dimension table, not a fact table
  
  recommended_filters: []
  
  sample_metric_view_yaml: |
    version: 1.1
    source: catalog.schema.marketproduct
    
    dimensions:
      - name: State
        expr: MarketDesc
        display_name: 'State'
        synonyms: ['state name', 'market']
        
      - name: State Code
        expr: MarketCode
        display_name: 'State Code'
        synonyms: ['state code', 'state abbreviation']
        
      - name: Insurance Program
        expr: ProgramDesc
        display_name: 'Insurance Program'
        synonyms: ['program', 'program type', 'insurance type']
        
      - name: Product
        expr: ProductDesc
        display_name: 'Product Brand'
        synonyms: ['product name', 'brand', 'plan name']
  
  usage_notes:
    - "This table contains many legacy fields that should NOT be exposed in metric views"
    - "End users only work with: State (MarketDesc/MarketCode), Program (ProgramDesc), and Product (ProductDesc)"
    - "When joining to fact tables, use MarketProduct_SK as the foreign key"
    - "ProgramDesc has known drift - consider CASE statement to standardize in metric view if needed"

