# Metric View Recommendations
metric_view_suggestions:
  
  confidence_threshold: 0.70
  status: "READY - Core pharmacy claims metrics identified"
  
  # Primary fact table fields
  recommended_dimensions:
    - RxNumber                          # Prescription number
    - PBMGenericFlag                    # Generic vs brand
    - CompoundFlag                      # Compound medication
    - RxClaimReversalFlag               # Reversal indicator
    - RefillNumber                      # Which refill
    - DrugStrengthQuantity              # Drug strength
    - PharmacyDAWCode                   # Dispense as written
    - DEAClassificationCode             # Controlled substance schedule
    - TransactionTypeCode               # Transaction type
    - PatientAge                        # Age at fill
    - PatientRelationshipCode           # Relationship to subscriber
  
  # Core utilization measures
  utilization_measures:
    - name: "Total Claims"
      expr: "COUNT(1)"
      description: "Total pharmacy claim count"
      
    - name: "Total Prescriptions"
      expr: "COUNT(DISTINCT RxNumber)"
      description: "Distinct prescription count"
      
    - name: "Total Quantity"
      expr: "SUM(PrescribedQuantity)"
      description: "Total prescribed quantity"
      
    - name: "Total Days Supply"
      expr: "SUM(DrugDaySupplyCount)"
      description: "Total days of medication supplied"
      
    - name: "Average Days Supply"
      expr: "AVG(DrugDaySupplyCount)"
      description: "Average days supply per fill"
  
  # Core cost measures
  cost_measures:
    - name: "Total Ingredient Cost Paid"
      expr: "SUM(IngredientPaidAmount)"
      description: "Total drug ingredient cost paid by plan"
      
    - name: "Total Dispensing Fee Paid"
      expr: "SUM(DispensingPaidAmount)"
      description: "Total dispensing fees paid to pharmacies"
      
    - name: "Total Plan Paid"
      expr: "SUM(IngredientPaidAmount) + SUM(DispensingPaidAmount)"
      description: "Total amount paid by plan (ingredient + dispensing)"
      
    - name: "Total Member Paid"
      expr: "SUM(PatientPaidAmount)"
      description: "Total amount paid by members"
      
    - name: "Total Member Copay"
      expr: "SUM(CopayAmount)"
      description: "Total member copayments"
      
    - name: "Total Coinsurance"
      expr: "SUM(CoinsuranceAmount)"
      description: "Total member coinsurance"
      
    - name: "Total Deductible Applied"
      expr: "SUM(AppliedPeriodicDeductableAmount)"
      description: "Total deductible amounts applied"
      
    - name: "Average Cost Per Claim"
      expr: "SUM(IngredientPaidAmount + DispensingPaidAmount) / COUNT(1)"
      description: "Average plan cost per claim"
      
    - name: "Average Member Cost Per Claim"
      expr: "SUM(PatientPaidAmount) / COUNT(1)"
      description: "Average member out-of-pocket per claim"
  
  # Ratio measures
  ratio_measures:
    - name: "Generic Utilization Rate"
      expr: "SUM(CASE WHEN PBMGenericFlag = 1 THEN 1 ELSE 0 END) / COUNT(1)"
      description: "Percentage of claims that are generic"
      
    - name: "Member Cost Share Rate"
      expr: "SUM(PatientPaidAmount) / (SUM(IngredientPaidAmount) + SUM(DispensingPaidAmount) + SUM(PatientPaidAmount))"
      description: "Member cost as percentage of total"
  
  # Supporting foreign keys (for joins, not measures)
  join_keys:
    - PharmFactClaimID                  # Primary key
    - Member_SK                         # Join to member
    - Pharmacy_SK                       # Join to pharmacy
    - Ndc_SK                           # Join to drug (NDC)
    - Practitioner_SK                   # Join to prescriber
    - FilledDate_Sk                    # Join to date dimension
    - IncurredDate_SK                  # Join to date dimension
  
  recommended_filters:
    - "RxClaimReversalFlag = 0 OR RxClaimReversalFlag IS NULL"  # Exclude reversals for net costs
  
  sample_metric_view_yaml: |
    version: 1.1
    source: catalog.schema.fact_pharmacy
    filter: RxClaimReversalFlag = 0 OR RxClaimReversalFlag IS NULL  # Exclude reversals
    
    # Join to dimensions
    joins:
      - name: member
        source: catalog.schema.dim_member
        on: source.Member_SK = member.Member_SK
        
      - name: pharmacy
        source: catalog.schema.dim_pharmacy
        on: source.Pharmacy_SK = pharmacy.Pharmacy_SK
        
      - name: ndc
        source: catalog.schema.dim_ndc
        on: source.Ndc_SK = ndc.Ndc_SK
        
      - name: fill_date
        source: catalog.schema.dim_date
        on: source.FilledDate_Sk = fill_date.DimensionDate_sk
    
    dimensions:
      - name: Fill Date
        expr: fill_date.DimensionDate
        display_name: 'Fill Date'
        synonyms: ['filled date', 'dispense date', 'date filled']
        
      - name: Is Generic
        expr: PBMGenericFlag
        display_name: 'Is Generic Drug'
        synonyms: ['generic', 'generic drug', 'brand vs generic']
        
      - name: Days Supply
        expr: DrugDaySupplyCount
        display_name: 'Days Supply'
        synonyms: ['days supply', 'supply days']
        
      # Use dimensions from joined tables
      - name: Drug Name
        expr: ndc.DrugProductDesc
        display_name: 'Drug Name'
        
      - name: Drug Class
        expr: ndc.DrugClassDesc
        display_name: 'Drug Class'
        
      - name: Pharmacy Name
        expr: pharmacy.PharmacyName
        display_name: 'Pharmacy'
    
    measures:
      - name: claim_count
        expr: COUNT(1)
        display_name: 'Total Claims'
        synonyms: ['claims', 'claim count', 'prescriptions filled']
        format:
          type: number
          decimal_places:
            type: all
          hide_group_separator: true
        
      - name: total_days_supply
        expr: SUM(DrugDaySupplyCount)
        display_name: 'Total Days Supply'
        synonyms: ['days supply', 'supply days']
        format:
          type: number
          decimal_places:
            type: all
        
      - name: plan_paid
        expr: SUM(IngredientPaidAmount) + SUM(DispensingPaidAmount)
        display_name: 'Plan Paid Amount'
        synonyms: ['plan cost', 'plan paid', 'reimbursement']
        format:
          type: currency
          currency_code: USD
          decimal_places:
            type: exact
            places: 2
          abbreviation: compact
        
      - name: member_paid
        expr: SUM(PatientPaidAmount)
        display_name: 'Member Paid Amount'
        synonyms: ['member cost', 'patient paid', 'out of pocket']
        format:
          type: currency
          currency_code: USD
          decimal_places:
            type: exact
            places: 2
          abbreviation: compact
        
      - name: avg_cost_per_claim
        expr: (SUM(IngredientPaidAmount) + SUM(DispensingPaidAmount)) / COUNT(1)
        display_name: 'Average Cost Per Claim'
        synonyms: ['avg cost', 'average cost', 'cost per claim']
        format:
          type: currency
          currency_code: USD
          decimal_places:
            type: exact
            places: 2
        
      - name: generic_rate
        expr: SUM(CASE WHEN PBMGenericFlag = 1 THEN 1 ELSE 0 END) / COUNT(1)
        display_name: 'Generic Utilization Rate'
        synonyms: ['generic rate', 'generic utilization', 'generic %']
        format:
          type: percentage
          decimal_places:
            type: exact
            places: 1
  
  usage_notes:
    - "CRITICAL: Filter RxClaimReversalFlag = 0 to exclude reversal claims when calculating net costs"
    - "Reversal claims have negative amounts - they void previously paid claims"
    - "FilledDate_Sk is the primary date for trending pharmacy utilization"
    - "Core cost fields: IngredientPaidAmount, DispensingPaidAmount, PatientPaidAmount"
    - "PBMGenericFlag critical for generic utilization analysis"
    - "DrugDaySupplyCount used for adherence metrics (PDC, MPR)"
    - "Join to dim_ndc for drug classifications and hierarchies"
    - "Join to dim_pharmacy for pharmacy network and location analysis"
    - "DEAClassificationCode identifies controlled substances"
    - "PharmacyDAWCode explains why brand was dispensed when generic available"

  common_use_cases:
    - "Pharmacy cost trending and forecasting"
    - "Generic utilization and substitution analysis"
    - "Medication adherence (using days supply and refill data)"
    - "High-cost drug identification"
    - "Pharmacy network performance"
    - "Brand vs generic cost comparison"
    - "Member cost share analysis"
    - "Controlled substance monitoring"
    - "Specialty pharmacy utilization"
    - "Mail order vs retail comparison"

