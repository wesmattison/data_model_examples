# Fact Pharmacy Claims Table Schema
# Status: DRAFT - Pharmacy claims fact table with extensive cost fields
# Created: 2026-02-09

table:
  name: catalog.schema.fact_pharmacy  # TODO: Update with actual catalog.schema
  type: fact
  description: "Pharmacy claims fact table containing detailed pharmacy claim transactions including costs, payments, quantities, and claim attributes. One row per pharmacy claim line. Used for pharmacy utilization, cost, and trend analysis."
  grain: "One row per pharmacy claim line"
  source_system: "Pharmacy Benefit Manager (PBM) / Claims System"
  refresh_frequency: "Daily or as claims are adjudicated"
  
  primary_key: [PharmFactClaimID]
  
  # Foreign keys to dimensions
  foreign_keys:
    - Practitioner_SK      # Prescribing provider
    - Pharmacy_SK          # Dispensing pharmacy
    - Member_SK            # Member who received prescription
    - Subscriber_SK        # Subscriber/policyholder
    - Ndc_SK              # National Drug Code (drug product)
    - MemberAgeAtRxFill_SK # Member age at fill
    - MarketProgram_SK     # Market/Program (likely deprecated, check with MarketProduct)
    - FilledDate_Sk       # Date dimension - filled date
    - IncurredDate_SK     # Date dimension - incurred date
    - WrittenDate_Sk      # Date dimension - written/prescribed date
    - PaidDate_Sk         # Date dimension - paid date
    - TransactionSubmitDate_Sk  # Date dimension - transaction submit date
    - PharmacyClaimAttribute_SK # Additional claim attributes
  
  data_quality_notes:
    - "Claim-level grain - one record per filled prescription"
    - "Multiple cost fields represent different perspectives: ingredient cost, dispensing fees, patient payments, plan payments"
    - "Quantity fields: PrescribedQuantity, DrugDaySupplyCount, DrugMetricQuantity"
    - "Reversal claims indicated by RxClaimReversalFlag"
    - "Generic substitution tracked via PBMGenericFlag and CompoundFlag"

columns:
  # Primary Key
  - name: PharmFactClaimID
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "PRIMARY KEY: Unique identifier for each pharmacy claim record"
    
    genie:
      description: "Unique system-generated identifier for each pharmacy claim line"
      synonyms: ["claim ID", "pharmacy claim ID"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: false
      unique: true
      primary_key: true

  # Claim Identifiers
  - name: RxNumber
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Prescription number - useful for tracking refills and claim identity"
    
    genie:
      description: "Prescription (Rx) number - unique identifier for the prescription from the pharmacy system"
      synonyms: ["prescription number", "Rx number", "Rx #"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    sample_values: ["RX123456", "RX789012"]

  - name: ExternalTransactionRefID
    data_type: string
    
    exposure:
      include_in_metric_view: false
      usage_category: internal_only
      reason: "External transaction reference - technical field"
    
    genie:
      description: "External system transaction reference ID"
      confidence_score: 0.70
      needs_review: false
    
    constraints:
      nullable: true

  - name: ExternalTransCrossRefID
    data_type: string
    
    exposure:
      include_in_metric_view: false
      usage_category: internal_only
      reason: "External cross-reference - technical field"
    
    genie:
      description: "External system cross-reference transaction ID"
      confidence_score: 0.70
      needs_review: false
    
    constraints:
      nullable: true

  # Foreign Keys to Dimensions
  - name: Practitioner_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Links to prescribing provider dimension"
    
    genie:
      description: "Foreign key to provider/practitioner dimension - identifies the prescribing provider"
      synonyms: ["provider key", "prescriber key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
      foreign_key: dim_provider.Provider_SK

  - name: Pharmacy_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Links to pharmacy dimension"
    
    genie:
      description: "Foreign key to pharmacy dimension - identifies the dispensing pharmacy location"
      synonyms: ["pharmacy key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
      foreign_key: dim_pharmacy.Pharmacy_SK

  - name: Member_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Links to member dimension"
    
    genie:
      description: "Foreign key to member dimension - identifies the member who received the prescription"
      synonyms: ["member key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
      foreign_key: dim_member.Member_SK

  - name: Subscriber_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Links to subscriber dimension"
    
    genie:
      description: "Foreign key to subscriber dimension - identifies the policyholder"
      synonyms: ["subscriber key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true

  - name: Ndc_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Links to NDC (drug) dimension"
    
    genie:
      description: "Foreign key to NDC dimension - identifies the drug product dispensed"
      synonyms: ["NDC key", "drug key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
      foreign_key: dim_ndc.Ndc_SK

  - name: MemberAgeAtRxFill_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "Foreign key to age dimension at time of fill"
    
    genie:
      description: "Foreign key to age dimension - member's age at time prescription was filled"
      synonyms: ["age key", "member age key"]
      confidence_score: 0.95
      needs_review: false
    
    constraints:
      nullable: true

  - name: MarketProgram_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: internal_only
      reason: "DEPRECATED: Older version - likely replaced by MarketProduct_SK (check if exists)"
    
    genie:
      description: "DEPRECATED: Legacy market/program foreign key - likely replaced by MarketProduct_SK"
      confidence_score: 0.80
      needs_review: true
      review_notes: "Confirm if MarketProduct_SK exists in this table; if so, use that instead"
    
    constraints:
      nullable: true

  # Date Foreign Keys
  - name: FilledDate_Sk
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Date prescription was filled - use for time-based analysis"
    
    genie:
      description: "Foreign key to date dimension - date the prescription was filled/dispensed by the pharmacy"
      synonyms: ["fill date key", "dispensed date key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
      foreign_key: dim_date.DimensionDate_sk

  - name: IncurredDate_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Date service was incurred"
    
    genie:
      description: "Foreign key to date dimension - date the service was incurred (typically same as filled date for pharmacy)"
      synonyms: ["incurred date key", "service date key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
      foreign_key: dim_date.DimensionDate_sk

  - name: WrittenDate_Sk
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Date prescription was written by provider"
    
    genie:
      description: "Foreign key to date dimension - date the prescription was written by the prescriber"
      synonyms: ["written date key", "prescribed date key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
      foreign_key: dim_date.DimensionDate_sk

  - name: PaidDate_Sk
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Date claim was paid"
    
    genie:
      description: "Foreign key to date dimension - date the claim was paid by the plan"
      synonyms: ["paid date key", "payment date key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
      foreign_key: dim_date.DimensionDate_sk

  - name: TransactionSubmitDate_Sk
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Date claim was submitted"
    
    genie:
      description: "Foreign key to date dimension - date the claim transaction was submitted to the plan"
      synonyms: ["submit date key", "submission date key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
      foreign_key: dim_date.DimensionDate_sk

  - name: PharmacyClaimAttribute_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "Foreign key to claim attributes dimension"
    
    genie:
      description: "Foreign key to pharmacy claim attributes dimension - additional claim characteristics"
      confidence_score: 0.80
      needs_review: false
    
    constraints:
      nullable: true

  # Claim Flags
  - name: PBMGenericFlag
    data_type: int
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Generic indicator - critical for brand vs generic analysis"
    
    genie:
      description: "PBM generic drug flag (1=generic, 0=brand). Indicates if the dispensed drug was generic or brand name."
      synonyms: ["generic flag", "is generic", "generic indicator"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    sample_values: [0, 1]
    
    notes: "Critical field for generic substitution and cost analysis"

  - name: CompoundFlag
    data_type: int
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Compound drug indicator - used for compound medication analysis"
    
    genie:
      description: "Compound medication flag (1=compounded, 0=not compound). Indicates if the prescription was a pharmacy-compounded medication."
      synonyms: ["compound", "is compound", "compounded drug"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    sample_values: [0, 1]
    
    notes: "Compound medications are custom-mixed by pharmacists"

  - name: RxClaimReversalFlag
    data_type: int
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Reversal indicator - essential for identifying reversed/voided claims"
    
    genie:
      description: "Claim reversal flag (1=reversal claim, 0=original claim). Indicates if this is a reversal of a previously paid claim."
      synonyms: ["reversal", "is reversal", "voided claim", "reversed claim"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    sample_values: [0, 1]
    
    notes: "Reversal claims typically have negative amounts. Filter these when calculating net costs."

  # Transaction Details
  - name: TransactionSubmitTime
    data_type: timestamp
    
    exposure:
      include_in_metric_view: false
      usage_category: internal_only
      reason: "Transaction timestamp - technical field, date dimension preferred"
    
    genie:
      description: "Timestamp when claim transaction was submitted"
      confidence_score: 0.90
      needs_review: false
    
    constraints:
      nullable: true

  - name: TransactionSource
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Transaction source system - may indicate claim origin"
    
    genie:
      description: "Source system or channel for the claim transaction (e.g., retail pharmacy, mail order, specialty)"
      synonyms: ["claim source", "transaction source"]
      confidence_score: 0.85
      needs_review: false
    
    constraints:
      nullable: true

  # Refill Information
  - name: AuthorizedRefillCount
    data_type: int
    
    exposure:
      include_in_metric_view: true
      usage_category: measure_candidate
      reason: "Authorized refills - useful for adherence and utilization analysis"
    
    genie:
      description: "Number of refills authorized by the prescriber for this prescription"
      synonyms: ["refills authorized", "refill count", "number of refills"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    sample_values: [0, 1, 2, 3, 5, 11]
    
    suggested_measures:
      - name: "Total Authorized Refills"
        expr: "SUM(AuthorizedRefillCount)"

  - name: RefillNumber
    data_type: int
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Refill sequence number - identifies which refill this is"
    
    genie:
      description: "Refill number for this fill (0=original fill, 1=first refill, 2=second refill, etc.)"
      synonyms: ["refill #", "refill sequence", "fill number"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    sample_values: [0, 1, 2, 3]

  # Quantity Fields
  - name: PrescribedQuantity
    data_type: decimal(14,2)
    
    exposure:
      include_in_metric_view: true
      usage_category: measure_candidate
      reason: "PRIMARY MEASURE: Prescribed quantity - core utilization metric"
    
    genie:
      description: "Quantity of drug prescribed by the provider (in units appropriate to the drug, e.g., tablets, ml)"
      synonyms: ["prescribed quantity", "quantity prescribed", "Rx quantity"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    suggested_measures:
      - name: "Total Prescribed Quantity"
        expr: "SUM(PrescribedQuantity)"

  - name: DrugDaySupplyCount
    data_type: int
    
    exposure:
      include_in_metric_view: true
      usage_category: measure_candidate
      reason: "PRIMARY MEASURE: Days supply - critical for adherence and utilization"
    
    genie:
      description: "Number of days the prescription is intended to last based on prescribed dosing (e.g., 30 days, 90 days)"
      synonyms: ["days supply", "day supply", "days of supply", "supply days"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    sample_values: [30, 60, 90]
    
    suggested_measures:
      - name: "Total Days Supply"
        expr: "SUM(DrugDaySupplyCount)"
      - name: "Average Days Supply"
        expr: "AVG(DrugDaySupplyCount)"

  - name: ARX
    data_type: int
    
    exposure:
      include_in_metric_view: false
      usage_category: internal_only
      reason: "Unknown field - needs clarification"
    
    genie:
      description: "NEEDS REVIEW: ARX field - purpose unclear"
      confidence_score: 0.30
      needs_review: true
      review_notes: "Acronym meaning unknown - may be authorization-related"
    
    constraints:
      nullable: true

  - name: DrugMetricQuantity
    data_type: decimal(14,2)
    
    exposure:
      include_in_metric_view: true
      usage_category: measure_candidate
      reason: "Metric quantity - standardized quantity measure"
    
    genie:
      description: "Drug quantity in metric units - standardized measurement (e.g., grams, milliliters)"
      synonyms: ["metric quantity", "quantity metric"]
      confidence_score: 0.85
      needs_review: false
    
    constraints:
      nullable: true

  - name: DrugStrengthQuantity
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Drug strength - useful for analyzing dosage patterns"
    
    genie:
      description: "Strength of the drug dispensed (e.g., '20mg', '500mg', '10mg/ml')"
      synonyms: ["strength", "drug strength", "dosage strength"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    sample_values: ["20mg", "500mg", "10mg/ml", "25mcg"]

  # Submission and Status Fields
  - name: SubmissionClarificationCode
    data_type: string
    
    exposure:
      include_in_metric_view: false
      usage_category: internal_only
      reason: "Claim processing code - technical field"
    
    genie:
      description: "Submission clarification code - indicates special processing circumstances"
      confidence_score: 0.70
      needs_review: false
    
    constraints:
      nullable: true

  - name: CMSStatus
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "CMS status - important for Medicare Part D reporting"
    
    genie:
      description: "CMS (Centers for Medicare & Medicaid Services) claim status - used for Medicare Part D reporting"
      synonyms: ["CMS status", "Medicare status"]
      confidence_score: 0.90
      needs_review: false
    
    constraints:
      nullable: true

  - name: NetIteration
    data_type: string
    
    exposure:
      include_in_metric_view: false
      usage_category: internal_only
      reason: "Technical field - claim iteration tracking"
    
    genie:
      description: "Net iteration - tracks claim resubmissions or adjustments"
      confidence_score: 0.65
      needs_review: true
    
    constraints:
      nullable: true

  # Adjustment Fields
  - name: AdjustmentTypeCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Adjustment type - indicates claim adjustments"
    
    genie:
      description: "Type of claim adjustment (if this is an adjusted claim)"
      synonyms: ["adjustment type", "adjustment code"]
      confidence_score: 0.85
      needs_review: false
    
    constraints:
      nullable: true

  - name: AdjustmentReasonCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Adjustment reason - explains why claim was adjusted"
    
    genie:
      description: "Reason for claim adjustment (if applicable)"
      synonyms: ["adjustment reason"]
      confidence_score: 0.85
      needs_review: false
    
    constraints:
      nullable: true

  - name: TransactionTypeCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Transaction type - distinguishes claim types (original, reversal, etc.)"
    
    genie:
      description: "Type of claim transaction (e.g., original claim, reversal, adjustment)"
      synonyms: ["transaction type", "claim type"]
      confidence_score: 0.90
      needs_review: false
    
    constraints:
      nullable: true

  # Pharmacy and Claim Codes
  - name: PharmacyDAWCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "DAW code - Dispense As Written, indicates generic substitution status"
    
    genie:
      description: "Dispense As Written (DAW) code - indicates if brand was dispensed when generic available (0=generic substituted, 1=brand medically necessary, 2=patient requested brand, etc.)"
      synonyms: ["DAW", "dispense as written", "DAW code"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    sample_values: ["0", "1", "2", "5"]
    
    notes: "DAW codes: 0=generic allowed and dispensed, 1=prescriber requires brand, 2=patient requested brand"

  # Patient Information
  - name: PatientAge
    data_type: int
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Patient age at fill - useful for age-based analysis"
    
    genie:
      description: "Patient age at time of prescription fill (in years)"
      synonyms: ["age", "patient age", "member age"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    sample_values: [25, 45, 67, 5]

  - name: PatientPlaceOfServiceCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Place of service - indicates where prescription was filled"
    
    genie:
      description: "Place of service code - where the prescription was filled (e.g., retail pharmacy, mail order, nursing home)"
      synonyms: ["place of service", "service location"]
      confidence_score: 0.90
      needs_review: false
    
    constraints:
      nullable: true

  - name: PatientFacilityID
    data_type: string
    
    exposure:
      include_in_metric_view: false
      usage_category: internal_only
      reason: "Facility ID - may contain PII or not broadly useful"
    
    genie:
      description: "Facility identifier where patient received prescription (e.g., nursing home, hospital)"
      confidence_score: 0.75
      needs_review: true
    
    constraints:
      nullable: true

  - name: CMSPartDQualifiedFacilityFlag
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Part D qualified facility - important for Medicare reporting"
    
    genie:
      description: "CMS Part D qualified facility flag - indicates if facility qualifies for Part D coverage"
      synonyms: ["Part D facility", "qualified facility"]
      confidence_score: 0.85
      needs_review: false
    
    constraints:
      nullable: true

  - name: MailOrderDaysSupplyQuantity
    data_type: int
    
    exposure:
      include_in_metric_view: true
      usage_category: measure_candidate
      reason: "Mail order days supply - specific to mail order fills"
    
    genie:
      description: "Days supply for mail order prescriptions (typically 90 days for mail order)"
      synonyms: ["mail order supply", "mail supply days"]
      confidence_score: 0.90
      needs_review: false
    
    constraints:
      nullable: true

  - name: PatientResidenceCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Patient residence code - indicates care setting"
    
    genie:
      description: "Patient residence code - indicates patient's care setting (e.g., home, nursing home, assisted living)"
      synonyms: ["residence code", "care setting"]
      confidence_score: 0.85
      needs_review: false
    
    constraints:
      nullable: true

  - name: PatientPersonCode
    data_type: string
    
    exposure:
      include_in_metric_view: false
      usage_category: internal_only
      reason: "Person code - unclear purpose"
    
    genie:
      description: "NEEDS REVIEW: Patient person code - purpose unclear"
      confidence_score: 0.50
      needs_review: true
    
    constraints:
      nullable: true

  - name: PatientRelationshipCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Patient relationship - indicates relationship to subscriber"
    
    genie:
      description: "Patient relationship to subscriber code (self, spouse, child, etc.)"
      synonyms: ["relationship", "patient relationship"]
      confidence_score: 0.95
      needs_review: false
    
    constraints:
      nullable: true

  - name: PatientEligibilityClarificationCode
    data_type: string
    
    exposure:
      include_in_metric_view: false
      usage_category: internal_only
      reason: "Eligibility clarification - technical field"
    
    genie:
      description: "Patient eligibility clarification code - special eligibility circumstances"
      confidence_score: 0.70
      needs_review: false
    
    constraints:
      nullable: true

  # Drug Classification Codes
  - name: DrugTypeCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Drug type code - classifies drug category"
    
    genie:
      description: "Drug type classification code (e.g., legend/prescription, OTC)"
      synonyms: ["drug type", "drug category"]
      confidence_score: 0.85
      needs_review: false
    
    constraints:
      nullable: true

  - name: DrugDosageFormCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Dosage form code - indicates formulation (tablet, capsule, etc.)"
    
    genie:
      description: "Drug dosage form code (tablet, capsule, liquid, injection, etc.)"
      synonyms: ["dosage form", "form code"]
      confidence_score: 0.90
      needs_review: false
    
    constraints:
      nullable: true

  - name: DrugCategoryCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Drug category - therapeutic or formulary classification"
    
    genie:
      description: "Drug category classification code"
      synonyms: ["drug category", "category code"]
      confidence_score: 0.80
      needs_review: false
    
    constraints:
      nullable: true

  - name: DEAClassificationCode
    data_type: string
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "DEA schedule - controlled substance classification"
    
    genie:
      description: "DEA (Drug Enforcement Administration) schedule classification (Schedule II-V for controlled substances)"
      synonyms: ["DEA schedule", "controlled substance schedule"]
      confidence_score: 1.0
      needs_review: false
    
