# Metric View Recommendations
metric_view_suggestions:
  
  confidence_threshold: 0.70
  status: "READY - Core enrollment metrics identified, ACG fields excluded per business rules"
  
  # Primary fact table fields for enrollment analysis
  recommended_dimensions:
    - MemberMonthStart              # Month date - TIME DIMENSION
    - COBFlag                        # Coordination of benefits indicator
  
  # Core enrollment measures
  recommended_measures:
    - name: "Total Members"
      expr: "COUNT(DISTINCT Member_SK)"
      description: "Distinct count of members enrolled in the period"
      
    - name: "Total Member Months"
      expr: "COUNT(1)"
      description: "Count of member month records (member months of enrollment)"
      
    - name: "New Members"
      expr: "SUM(NewMemberCount)"
      description: "Count of new member enrollments"
      
    - name: "Continuing Members"
      expr: "SUM(ContinueMemberCount)"
      description: "Count of continuing members (retained from prior month)"
      
    - name: "Termed Members"
      expr: "SUM(TermedMemberCount)"
      description: "Count of member terminations"
      
    - name: "Enrollment Days"
      expr: "SUM(DaysInMonth)"
      description: "Total member days of enrollment"
      
    - name: "Average Member Months Enrolled"
      expr: "SUM(DaysInMonth) / 30.0"
      description: "Member months adjusted for partial enrollment (30-day standard)"
  
  # Optional tenure-based measures
  tenure_measures:
    - name: "Average Member Tenure"
      expr: "AVG(EndOfMonthAge_SK)"
      description: "Average months of enrollment tenure"
  
  # Supporting foreign keys (for joins, not measures)
  join_keys:
    - MemberMonth_SK                # Primary key
    - Member_SK                     # Join to member dimension
    - MarketProduct_SK              # Join to market/product dimension
    - AssignedProvider_SK           # Join to provider dimension (optional)
    - AttributedProvider_SK         # Join to provider dimension (optional)
  
  # Fields explicitly excluded per business rules
  excluded_fields:
    - MarketProgram_SK              # Deprecated
    - All ACG fields                # Clinical segmentation - separate analysis tables exist
  
  recommended_filters: []
  
  sample_metric_view_yaml: |
    version: 1.1
    source: catalog.schema.fact_membermonth
    
    # Join to dimensions
    joins:
      - name: member
        source: catalog.schema.dim_member
        on: source.Member_SK = member.Member_SK
        
      - name: market_product
        source: catalog.schema.dim_marketproduct
        on: source.MarketProduct_SK = market_product.MarketProduct_SK
        
      - name: date_dim
        source: catalog.schema.dim_date
        on: source.MemberMonthStart = date_dim.DimensionDate
    
    dimensions:
      - name: Month
        expr: MemberMonthStart
        display_name: 'Enrollment Month'
        synonyms: ['month', 'enrollment month', 'member month']
        format:
          type: date
          date_format: year_month_day
        
      - name: Has Other Insurance
        expr: COBFlag
        display_name: 'Has Other Insurance (COB)'
        synonyms: ['COB', 'coordination of benefits', 'other insurance']
        
      # Use dimensions from joined tables
      - name: State
        expr: market_product.MarketDesc
        display_name: 'State'
        
      - name: Program
        expr: market_product.ProgramDesc
        display_name: 'Insurance Program'
    
    measures:
      - name: total_members
        expr: COUNT(DISTINCT Member_SK)
        display_name: 'Total Members'
        synonyms: ['members', 'member count', 'enrollment']
        format:
          type: number
          decimal_places:
            type: all
          hide_group_separator: true
        
      - name: member_months
        expr: COUNT(1)
        display_name: 'Member Months'
        synonyms: ['member months', 'enrollment months']
        format:
          type: number
          decimal_places:
            type: all
          hide_group_separator: true
        
      - name: new_members
        expr: SUM(NewMemberCount)
        display_name: 'New Members'
        synonyms: ['new enrollment', 'new adds', 'new members']
        format:
          type: number
          decimal_places:
            type: all
        
      - name: continuing_members
        expr: SUM(ContinueMemberCount)
        display_name: 'Continuing Members'
        synonyms: ['continuing', 'retained members']
        format:
          type: number
          decimal_places:
            type: all
        
      - name: termed_members
        expr: SUM(TermedMemberCount)
        display_name: 'Termed Members'
        synonyms: ['terminations', 'disenrollment', 'churn']
        format:
          type: number
          decimal_places:
            type: all
        
      - name: retention_rate
        expr: SUM(ContinueMemberCount) / (SUM(ContinueMemberCount) + SUM(TermedMemberCount))
        display_name: 'Retention Rate'
        synonyms: ['retention', 'retention percentage']
        format:
          type: percentage
          decimal_places:
            type: exact
            places: 2
  
  usage_notes:
    - "Member month grain - one record per member per month of enrollment"
    - "Sum NewMemberCount, ContinueMemberCount, TermedMemberCount for enrollment trends"
    - "COUNT(DISTINCT Member_SK) for unique member count in a period"
    - "COUNT(1) for total member months (enrollment volume)"
    - "DaysInMonth and MonthDaysRatio useful for prorating partial month enrollment"
    - "StartOfMonthAge_SK and EndOfMonthAge_SK track member tenure (months enrolled)"
    - "MarketProgram_SK is deprecated - always use MarketProduct_SK"
    - "All ACG fields excluded from metric views - dedicated ACG analysis tables exist"
    - "COBFlag indicates members with other insurance (coordination of benefits)"

  common_use_cases:
    - "Enrollment trends - new adds, terminations, net change by month"
    - "Retention analysis - continuation rates, churn rates by program/state"
    - "Member tenure analysis - enrollment longevity, retention by tenure cohort"
    - "Geographic enrollment - member distribution by state, county, ZIP"
    - "Program mix - enrollment by insurance program (Medicaid, Medicare, etc.)"
    - "Partial month enrollment - prorated metrics using DaysInMonth or MonthDaysRatio"
    - "COB analysis - members with other insurance coverage"

