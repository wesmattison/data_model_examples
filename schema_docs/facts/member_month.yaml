# MemberMonth Fact Table Schema
# Status: REVIEWED - Member enrollment fact table
# Created: 2026-02-09

table:
  name: catalog.schema.fact_membermonth  # TODO: Update with actual catalog.schema
  type: fact
  description: "Member month fact table tracking member enrollment status and counts by month. One row per member per month. Used for membership analytics, enrollment trends, and member retention analysis. Contains member counts (new, continuing, termed) and age tracking."
  grain: "One row per member per month"
  source_system: "TODO: Identify source system"
  refresh_frequency: "Monthly"
  
  primary_key: [MemberMonth_SK]
  
  # Foreign keys to dimensions
  foreign_keys:
    - Member_SK           # Links to member dimension
    - MarketProduct_SK    # Links to market/product dimension
  
  data_quality_notes:
    - "Monthly grain - one record per member per month of enrollment"
    - "Member counts (New, Continue, Termed) should sum to understand enrollment changes"
    - "StartOfMonthAge_SK and EndOfMonthAge_SK track member tenure (months enrolled)"
    - "MarketProgram_SK is deprecated - use MarketProduct_SK instead"
    - "ACG fields are for clinical segmentation - separate tables exist for detailed ACG analysis"

columns:
  # Primary Key
  - name: MemberMonth_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "PRIMARY KEY: Unique identifier for each member-month record"
    
    genie:
      description: "Unique system-generated identifier for each member-month combination"
      synonyms: ["member month key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: false
      unique: true
      primary_key: true

  # Foreign Keys to Dimensions
  - name: Member_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Links to member dimension - essential for joins but not displayed"
    
    genie:
      description: "Foreign key to member dimension - identifies which member this month record belongs to"
      synonyms: ["member key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: false
      foreign_key: dim_member.Member_SK

  - name: MarketProduct_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: surrogate_key
      reason: "FOREIGN KEY: Links to market/product dimension - essential for joins"
    
    genie:
      description: "Foreign key to market product dimension - identifies the state and insurance program for this enrollment"
      synonyms: ["market product key"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: false
      foreign_key: dim_marketproduct.MarketProduct_SK

  # Time Dimension
  - name: MemberMonthStart
    data_type: date
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "PRIMARY FIELD: First day of the month - essential for time-based analysis"
    
    genie:
      description: "First day of the month for this member enrollment record (e.g., 2024-01-01 for January 2024)"
      synonyms: ["month", "enrollment month", "member month", "month start"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: false
    
    sample_values: ["2024-01-01", "2024-02-01", "2024-03-01"]

  # Member Count Measures
  - name: NewMemberCount
    data_type: int
    
    exposure:
      include_in_metric_view: true
      usage_category: measure_candidate
      reason: "PRIMARY MEASURE: Count of new member enrollments - critical for enrollment growth analysis"
    
    genie:
      description: "Indicator for new member enrollment this month (1 if member is newly enrolled this month, 0 if not new). Sum to get total new member count."
      synonyms: ["new members", "new enrollment", "new enrollees", "new adds"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: false
    
    sample_values: [0, 1]
    
    suggested_measures:
      - name: "Total New Members"
        expr: "SUM(NewMemberCount)"
        description: "Total count of new member enrollments"

  - name: ContinueMemberCount
    data_type: int
    
    exposure:
      include_in_metric_view: true
      usage_category: measure_candidate
      reason: "PRIMARY MEASURE: Count of continuing members - essential for retention analysis"
    
    genie:
      description: "Indicator for continuing member (1 if member was enrolled last month and continues this month, 0 if not continuing). Sum to get total continuing member count."
      synonyms: ["continuing members", "retained members", "continuing enrollment"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: false
    
    sample_values: [0, 1]
    
    suggested_measures:
      - name: "Total Continuing Members"
        expr: "SUM(ContinueMemberCount)"
        description: "Total count of members who continued enrollment from prior month"

  - name: TermedMemberCount
    data_type: int
    
    exposure:
      include_in_metric_view: true
      usage_category: measure_candidate
      reason: "PRIMARY MEASURE: Count of terminated members - critical for churn analysis"
    
    genie:
      description: "Indicator for member termination (1 if member's enrollment ended this month, 0 if not termed). Sum to get total termed member count."
      synonyms: ["terminated members", "termed members", "disenrollment", "member loss", "churn"]
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: false
    
    sample_values: [0, 1]
    
    suggested_measures:
      - name: "Total Termed Members"
        expr: "SUM(TermedMemberCount)"
        description: "Total count of members who terminated enrollment this month"

  # Member Age/Tenure Fields
  - name: StartOfMonthAge_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Member tenure at start of month - useful for retention analysis by tenure"
    
    genie:
      description: "Member tenure (in months) at the start of this month - indicates how long the member has been enrolled. May be a foreign key to an age/tenure dimension."
      synonyms: ["member tenure", "enrollment tenure", "months enrolled", "start tenure"]
      confidence_score: 0.90
      needs_review: false
      review_notes: "Appears to track enrollment tenure (months as member) rather than demographic age"
    
    constraints:
      nullable: true

  - name: EndOfMonthAge_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: true
      usage_category: dimension_candidate
      reason: "Member tenure at end of month - useful for retention analysis"
    
    genie:
      description: "Member tenure (in months) at the end of this month - indicates how long the member has been enrolled by month end. May be a foreign key to an age/tenure dimension."
      synonyms: ["member tenure", "enrollment tenure", "months enrolled", "end tenure"]
      confidence_score: 0.90
      needs_review: false
      review_notes: "Appears to track enrollment tenure (months as member) rather than demographic age"
    
    constraints:
      nullable: true

  # Deprecated Field
  - name: MarketProgram_SK
    data_type: bigint
    
    exposure:
      include_in_metric_view: false
      usage_category: internal_only
      reason: "DEPRECATED: Older version of MarketProduct_SK - use MarketProduct_SK instead"
    
    genie:
      description: "DEPRECATED: Legacy market/program foreign key - replaced by MarketProduct_SK"
      confidence_score: 1.0
      needs_review: false
    
    constraints:
      nullable: true
    
    notes: "Deprecated field - do not use in new reports or metric views"

  # ACG Clinical Segmentation Fields
